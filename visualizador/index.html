<!--
index.html
Visualizador gráfico de las palabras más populares en métodos de Python y Java.

Contiene:
- Un título y descripción del gráfico.
- Un input interactivo para definir cuántas palabras mostrar en el gráfico (Top N).
- Un lienzo para mostrar los gráficos.
- Enlace a script.js para la lógica interna de los gráficos.
-->

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Visualizador</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: #0f172a;
            color: white;
        }

        h1 {
            margin-top: 20px;
        }

        .controls {
            margin: 20px;
        }

        input {
            padding: 5px;
            font-size: 16px;
            width: 60px;
        }

        .charts {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        .chart-container {
            width: 40%;
            height: 50vh;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
        }
    </style>
</head>
<body>

    <h1>📊 Ranking de palabras (Python vs Java)</h1>

    <div class="controls">
    <!-- Controles para definir cuántas palabras mostrar en el gráfico -->
        <label>Top N:</label>
        <input type="number" id="topN" value="10" min="1" max="50">
    </div>

    <div class="charts">
        <div class="chart-container">
            <h2>Python</h2>
            <canvas id="graficoPy"></canvas>
            <!-- Canvas donde Chart.js dibuja el gráfico -->
        </div>

        <div class="chart-container">
            <h2>Java</h2>
            <canvas id="graficoJava"></canvas>
        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
